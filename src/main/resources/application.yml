spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petroad}
    username: ${DB_USERNAME:petroad}
    password: ${DB_PASSWORD:petroad}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
jwt:
  secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
