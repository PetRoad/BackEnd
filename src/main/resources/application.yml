spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/petroad}
    username: ${DB_USERNAME:petroad}
    password: ${DB_PASSWORD:petroad}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    property-naming-strategy: SNAKE_CASE
server:
  port: ${PORT:8080}
  forward-headers-strategy: none
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
security:
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    failure-window: ${LOGIN_FAILURE_WINDOW:15m}
    lock-duration: ${LOGIN_LOCK_DURATION:15m}
    ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:30}
    ip-window: ${LOGIN_IP_WINDOW:1m}
    max-tracked-entries: ${LOGIN_MAX_TRACKED_ENTRIES:10000}
    trusted-proxy-addresses: ${LOGIN_TRUSTED_PROXY_ADDRESSES:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
